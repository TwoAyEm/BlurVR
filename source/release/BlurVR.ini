; BlurVR settings.  Only the options most people need are here; every other option (HUD, menu screen, keys, rear-view mirror ...) is
; listed in README.txt: add the line under the right [section] to use it.  Edit with the game closed.  Delete this file for the defaults.

[Render]
; Extra size offered in the game's video options.  The picture is side by side, so each eye gets half of the width.
; 2160x1200 is a safe size for any PC.  Sizes for other headsets are in README.txt (Valve Index: 4936x2740).
CustomWidth=2160
CustomHeight=1200

; The size the game starts at.  0 = the size you last chose in the game's video options (recommended).
StartWidth=0
StartHeight=0

; 1 = give SteamVR each frame on the graphics card instead of through the CPU (faster, most at big sizes).  Set 0 if anything looks wrong.
SharedTransport=1
