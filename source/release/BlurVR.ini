; BlurVR settings.  Only the options most people need are here; every other option (HUD, menu screen, keys, rear-view mirror ...) is
; listed in README.md: add the line under the right [section] to use it.  Edit with the game closed.  Delete this file for the defaults.

[General]
; 0 = the mod does nothing at all (the game runs as if it were not installed)
Enabled=1
; 1 = VR.  0 = flat: SteamVR is not used and the game stays on the monitor; only [Display] and [Input] are used then.
Stereo=1

[VR]
; How the headset is reached: openvr = SteamVR, openxr = the system's active OpenXR runtime (it needs a 32-bit build, see README.md).
Api=openvr

; Size of the VR picture, both eyes side by side (each eye gets half of the width).  The game's resolution list shows headset sizes (README.md
; says which is which); pick one there and it is written here.  2160x1200 is a safe size for any PC (Valve Index: 4936x2740).
Resolution=2160x1200

; Upscaling, off by default: set Upscale=1 for a sharper headset picture.  In a race (and the showroom) the game renders at Resolution and the picture is enlarged on the graphics card
; by UpscaleFactor (README.md, "Upscaling").  It costs a little frame time (about 2 frames per second where the processor is the limit).
Upscale=0
; How many times as wide and high the headset picture is (1 to 4; 1.25 to 1.5 is a good range)
UpscaleFactor=1.5

; 1 = give SteamVR each frame on the graphics card instead of through the CPU (faster, most at big sizes).  Set 0 if anything looks wrong.
SharedTransport=1

; What the window on the desktop shows: off ("Playing in VR" and the game's logo, nothing of the game's picture), left or right (that eye's view, in a race), or both (the whole side-by-side picture).
DesktopView=off

; 0 = no motion blur: a sharper picture, but no real gain in frame rate.  1 = the game's own motion blur.
MotionBlur=1

; 0 = no reflections in the water of a race (saves frame time).  1 = the game's own reflections.
Reflections=1

; 1 = cockpit view: in a race your head sits in the driver's seat, fixed to the car (README.md, "Cockpit view").  Num0 switches it in game.
CockpitView=0
