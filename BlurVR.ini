; BlurVR settings, every option at its default.  Edit with the game closed.  A line you delete uses the default shown here.
; Enabled=0 does nothing at all.  Enabled=1 and Stereo=1 is VR.  Enabled=1 and Stereo=0 is flat: SteamVR is never started and
; only Enabled, Stereo, Log, [Display] and [Input] are used.  Key codes are virtual-key codes in hex (F9 = 0x78).

[General]
; master switch: 0 = the mod does nothing (the game runs as if it were not installed)
Enabled=1
; 1 = VR, 0 = flat (the game stays on the monitor)
Stereo=1
; 1 = write BlurVR.log (for bug reports; the log of the previous run is kept as BlurVR.previous.log)
Log=0
; F9 recenter, F10 head tracking on/off, F8 cycle mode (auto / force menu / force race)
RecenterKey=0x78
ToggleKey=0x79
ModeKey=0x77
; 0 = auto (floating screen in menus, seated 3D in races), 1 = always floating screen, 2 = always race/3D
StartMode=0
; 1 = also recentre every time a race starts
AutoRecenter=1
; 1 = start OpenVR on a worker thread (keeps SteamVR from flagging the game as not responding)
ThreadedInit=1
; 1 = keep the game flat (SteamVR theatre) until the first level starts loading, then start VR
DeferVR=1

[Display]
; 1 = V-Sync off, the game runs as fast as it can.  0 = the game's own V-Sync setting (with V-Sync on, the monitor's refresh rate).
; Ignored in VR: V-Sync is always off there and the headset's refresh rate sets the frame rate.
ForceNoVSync=0

[Input]
; In the game's menus a held key or pad button repeats once every this many milliseconds, whatever the frame rate (0 = as the game does it).
; The game repeats a held key every frame after a second, so at a high frame rate a menu scrolls far too fast.  Races are not touched, except while a pause or results menu is up over one (F8 forces it if it is not recognised).
KeyRepeatMs=60

[VR]
; How the headset is reached: openvr = SteamVR, openxr = the system's active OpenXR runtime.  Blur is a 32-bit game, so OpenXR needs a runtime
; with a 32-bit build (SteamVR 2.17 and later has one; see README.md).  If OpenXR cannot start the game stays flat and BlurVR.log says why.
Api=openvr
; Only with Api=openxr: the .json of the OpenXR runtime to use instead of the system's active one (empty = the system's)
OpenXRRuntime=
; Size of the VR picture, both eyes side by side (each eye gets half the width).  The game's resolution list shows headset sizes instead of the
; monitor's modes (see README.md for which is which) plus this one; it is the size the game starts at, and a size picked in the options is written back here.
Resolution=2160x1200
; Strength of the game's glow around menus, UI and loading screens, in percent (0 = none, 200 = double)
Bloom=100
; 1 = drop the lens-flare sprites and the glow around lights
NoLensFlare=0
; 0 = no motion blur (the game's blur pass only copies the picture, which saves a little frame time).  1 = the game's own motion blur, drawn for each eye
MotionBlur=1
; 0 = no reflections in the water of a race: the game's reflection pass is left out, which saves frame time (the menu showroom keeps the reflection in its floor).  1 = the game's own reflections.
Reflections=1
; 1 = run the game on a Direct3D 9Ex device and give SteamVR each race frame on the GPU instead of through the CPU
SharedTransport=1
; What the window on the desktop shows in a race: left (the left eye's view), right, both (the whole side-by-side picture), or off ("Playing in VR" and the game's logo; nothing of the game's picture)
DesktopView=off
; The desktop window really updates only every n-th race frame (1 = every frame, 2-4 saves a little GPU time)
DesktopPresentEvery=1
; 1 = the game's window is never bigger than the work area of its monitor
FitDesktopWindow=1
; 1 = a small panel in the headset (lower left of your view, in races and in the showroom) shows the frames a second the game presents: green at the headset's refresh rate, yellow below it, red far below, with a graph of the last 18 seconds under it.  Num9 switches it in game.
FpsCounter=0

[Tracking]
; head rotation / position (lean in your seat) move the camera
Rotation=1
Position=1
; game units per metre
PositionScale=1.0
; scale of the eye separation (1.0 = your real IPD)
IpdScale=1.0
; 1 = each eye's pose from SteamVR (covers canted displays); 0 = half the IPD to each side
EyeTransform=1

[Render]
; <1 zooms in, >1 zooms out
FovScale=1.0
; black pixels at the inner edge of each eye (stops glow bleeding across the seam)
SeamGutter=0
; advanced, leave alone unless told to
MainPassMinWidthFraction=0.9
RequireDepthBuffer=1
HalfResPasses=1
ReflectionLookupFix=1
ReflectionFlip=-1

[Hud]
; 1 = the HUD hangs in front of the car, 0 = glued to your view
WorldLocked=1
; panel width as a fraction of one eye's width, apparent distance in metres, vertical offset (fraction of height, + = down)
Scale=0.6
Distance=2.0
OffsetY=0.0
; extra convergence per eye, as a fraction of one eye's width
XOffset=0.0
; how dark the veil behind popups is (0-255): in a race, on the results screen, in menus
VeilRace=120
VeilResults=36
VeilMenu=100
; how dark the scene gets behind pause/results menus (0-100)
DimStrongPct=60
; 1 = drop the game's full-screen dim/blur copies (they would blank the HUD layer)
DropBackdrop=1
; 1 = hide the HUD layer while a full-screen video plays
HideFullscreenOverlay=1
; 1 = hide the race-start letterbox pieces (0 = draw them into the HUD)
CountInDrop=1
; how often (in frames) each UI draw is checked for covering the screen (1 = every frame, slower)
CoverageEvery=8
; 1 = rear-view mirror as its own 3D panel; depth that sits at the panel (m), eye separation scale, head parallax (0-1)
Mirror3D=1
MirrorConvergence=1.5
MirrorEyeScale=1.0
MirrorHeadParallax=1.0

[Menu]
; the floating screen in menus: distance (m), width (m), height relative to your eyes (m)
Distance=2.2
Width=2.6
HeightOffset=0.0

[Culling]
; the game draws what a frustum around your head (both eyes' field of view) needs: degrees added to every side of that frustum, and metres its apex is moved back
MarginDeg=6.0
PullBack=0.3

[Debug]
; Num6 3D mirror on/off, Num7 timing probe, Num8 save the picture sent to the headset, Num9 FPS counter on/off
KeyMirror3D=0x66
KeyPerf=0x67
KeyDump=0x68
KeyFps=0x69
AdjustViewRotation=1

[Perf]
; 1 = write timing lines to the log once a second while racing (needs Log=1; Num7 switches it in game)
Enabled=0

[Foveation]
; 1 = at VR start, log the headset model, refresh rate, render size and how much of each eye's image the lenses hide (needs Log=1)
Report=1

[Matrix]
; auto, row or transposed
Layout=auto
