; BlurVR settings. Edit while the game is closed. Anything left out uses the default shown.

[General]
Enabled=1
; Write BlurVR.log (useful for bug reports)
Log=1
; Virtual-key codes. F9=0x78 recenter, F10=0x79 head tracking on/off, F8=0x77 cycle mode (auto / force menu / force race)
RecenterKey=0x78
ToggleKey=0x79
ModeKey=0x77
; 0 = auto (floating screen in menus, seated 3D in races), 1 = always floating screen, 2 = always race/3D
StartMode=0
; 1 = also recentre (SteamVR's seated zero pose) every time a race starts. 0 = only when you press the recentre key (or use SteamVR's own recentre)
AutoRecenter=1

[Tracking]
Rotation=1
; Positional tracking (lean in your seat). PositionScale = game units per metre.
Position=1
PositionScale=1.0
IpdScale=1.0

[Render]
; Extra resolution offered in the game's video options (0 = off). The image is side by side, so each eye gets half the width:
; CustomWidth = 2 x the width per eye, CustomHeight = the height per eye.
; The monitor has no such mode, so the game runs in a window (only the headset sees it).
; Recommended sizes: the headset's panel resolution per eye x 1.4 on each side (140%, what SteamVR renders by default to make up
; for the lens distortion), both eyes side by side. Remove the ';' from a pair to use it (and comment out the two lines below).
; Bigger is sharper but heavier.  Without SharedTransport every frame is copied through the CPU, so the largest sizes need a very strong PC.
; HTC Vive, Oculus Rift CV1 (1080x1200 per eye):
;CustomWidth=3024
;CustomHeight=1680
; Oculus Rift S (1280x1440):
;CustomWidth=3584
;CustomHeight=2016
; Valve Index, HTC Vive Pro, Meta Quest 1 (1440x1600):
;CustomWidth=4032
;CustomHeight=2240
; Meta Quest Pro (1800x1920):
;CustomWidth=5040
;CustomHeight=2688
; Meta Quest 2, Meta Quest 3S (1832x1920):
;CustomWidth=5128
;CustomHeight=2688
; Meta Quest 3 (2064x2208):
;CustomWidth=5780
;CustomHeight=3092
; Valve Steam Frame, HP Reverb G2, Pico 4 (2160x2160):
;CustomWidth=6048
;CustomHeight=3024
; HTC Vive Pro 2, HTC Vive Focus 3 (2448x2448):
;CustomWidth=6856
;CustomHeight=3428
; The active size: 4936x2740 is what SteamVR itself renders for a Valve Index (2468x2740 per eye, about 8.5 times the pixels of the
; 2160x1200 default, which is the built-in default and the safe choice for any PC).  Needs SharedTransport=1 below to be affordable.
CustomWidth=4936
CustomHeight=2740

; 1 = the mod turns the game's V-Sync off so that the headset sets the frame rate (the game's own V-Sync would hold it at your
; monitor's refresh rate, e.g. 60). If the game runs at the wrong speed with this, set 0 and turn V-Sync off in the game's video options.
ForceNoVSync=1

; Frame rate cap (0 = no cap, the headset sets the pace). 60 holds the game to 60 frames per second, which avoids the audio
; stutter some people get at high frame rates. A cap below the headset's refresh rate makes SteamVR reproject the frames in between.
; (The other way to get a 60 Hz game is ForceNoVSync=0, which makes it follow the monitor's V-Sync.)
MaxFps=0

; 1 = true stereo (left/right halves of the game image). 0 = single centre image shown to both eyes.
Stereo=1

; 1.0 = headset's full field of view. <1 zooms in, >1 zooms out.
FovScale=1.0

; Black pixels left at the inner edge of each eye so glow cannot bleed across the seam (0 = off)
SeamGutter=0

; 1 = no lens flares: drops the flare sprites (rear-view mirror) and the glow around lights on the car. 0 = leave them.
NoLensFlare=0

; 1 = no menu bloom: removed bloom from ingame menus and loading screens.
NoBloom=0

; 1 = run the game on a Direct3D 9Ex device and give SteamVR each finished race frame as a shared texture instead of copying it through the CPU
; (saves several ms per frame, more at higher resolutions; the game gets an Ex device, so if anything looks wrong set it back to 0)
SharedTransport=1
; What the window on the desktop shows in a race: 1 = the left eye's view (the headset's own picture is not touched), 2 = the right eye's,
; 0 = the whole side-by-side picture.  Menus and loading screens are always shown whole.
DesktopView=1
; The window on the desktop is only a mirror of what the headset shows.  In a race, really present it only every this many frames
; (1 = every frame, as the game wants).  2 to 4 saves a little GPU time; the window on the desktop then updates less often.
DesktopPresentEvery=4
; 1 = the game's window on the desktop is never bigger than the work area of its monitor (it is only a mirror of the headset).  The game still
; renders at the size it asked for (3840x2160 and more); the window shows one eye's view of it, scaled to fit.  Windowed mode only.  0 = as the game wants
FitDesktopWindow=1
; 1 = a windowed start gets the video mode the game saved (settings.xml) as its picture size even when Windows shrinks the window to fit
; the desktop (two 1080p monitors cannot hold a 3840x2160 window: the game started in a 3840x1071 picture with a stretched intro video and a
; cut-off UI).  0 = leave the game's own choice
StartAtSavedSize=1
; The size to start the game at (0 = the video mode the game saved in settings.xml).  The game saves the size it was last reset to, so a
; start that Windows clamped overwrites its setting with the clamped size; this keeps the size you want.  Picking another size in the
; game's options still works.  3840x2160 is "4k"; 4936x2740 is what SteamVR renders for an Index.
StartWidth=3840
StartHeight=2160

[Hud]
; The game's UI draws are checked for covering the whole screen (dim and fill pieces) with a query; waiting for its answer cost the CPU about
; 2.5 ms of every frame.  In a race the answer is now collected without waiting and each UI draw is measured again every this many frames
; (staggered); 1 = check every draw every frame and wait, as before.  A fill that suddenly appears can be noticed a few frames late.
CoverageEvery=8
; 1 = the HUD stays fixed in front of the car (does not follow your head); 0 = glued to your view
WorldLocked=1

; Panel width as a fraction of one eye's width, apparent distance in metres, vertical offset (fraction of height, + = down)
Scale=0.6
Distance=2.0
OffsetY=0.0

; Extra convergence per eye as a fraction of one eye's width (+ = left eye moves right and right eye moves left; try 0.01 steps, negative to reverse)
XOffset=0.0

; Brightness of popups and dialogs, and how dark the veil behind them is (0-255)
VeilRace=120
VeilResults=36
VeilMenu=100

; How dark the scene gets behind pause/results menus (0-100)
DimStrongPct=60

; 100 = Strength of glow/bloom in UI elements
UiGlow=100

; ---- rear-view mirror (the key that switches it in game is in the Debug section below) ----
; 1 = rear-view mirror as its own panel at the HUD's distance, with the rear view rendered once per eye (real depth)
Mirror3D=1
; Depth (metres behind the mirror camera) that sits exactly at the panel. Nearer things come out of the mirror, farther ones recede.
MirrorConvergence=1.5
; Scale of the eye separation used for the rear view (1 = real, 0 = flat)
MirrorEyeScale=1
; How much your head position also moves the rear view (0 = not at all, 1 = like a real mirror)
MirrorHeadParallax=1

[Menu]
; Floating screen used in menus: distance (m), width (m), height relative to your eyes (m)
Distance=2.2
Width=2.6
HeightOffset=0.0

[Debug]
; In-game switch (virtual-key code, 0 = unused). Default is numpad 6: 3D mirror on/off
KeyMirror3D=0x66
; Numpad 7: timing probe on/off (see [Perf])
KeyPerf=0x67
; Numpad 8: save the picture sent to the headset and the UI layers as BlurVR_dump_*.bmp in the BlurVR folder (large files, delete them afterwards)
KeyDump=0x68

[Perf]
; 1 = write GPU time per rendering phase and CPU time per frame to BlurVR.log once a second while racing (needs Log=1; numpad 7 switches it in game)
Enabled=0

[Foveation]
; 1 = at VR start, log the headset model, its refresh rate and render size and how much of each eye's image the lenses hide (needs Log=1)
Report=1
